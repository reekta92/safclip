[package]
name = "safclip-controller"
version = "0.1.0"
edition = "2021"
author = "Your Name <you@example.com>"
description = "A brief description of the safclip controller application."
license = "MIT"

[lib]
name = "safclip_controller"
path = "src/lib.rs"

[[bin]]
name = "safclip"
path = "src/main.rs"
[dependencies]
ratatui = "0.30"
crossterm = "0.29"
mpris = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
